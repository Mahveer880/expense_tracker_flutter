name: expense_tracker
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  provider: ^6.1.5
  go_router: ^16.0.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^0.69.0
  pdf: ^3.11.0
  printing: ^5.13.4
  path_provider: ^2.1.5
  share_plus: ^10.0.2
  file_picker: ^10.2.0
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.3

flutter:

  uses-material-design: true

flutter_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#5B3DF5"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

